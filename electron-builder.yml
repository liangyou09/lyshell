appId: com.lyshell.app
productName: LyShell
copyright: Copyright © 2026 liangyou (MIT License)

# 优先复用已安装且匹配目标的 Electron；缺失或交叉打包时使用下载缓存。
extends: ./scripts/electron-builder-cache.cjs

# npm install / npm run rebuild 在当前 Electron 中验证官方 Node-API 预编译模块，
# 必要时使用 @electron/rebuild 重建；打包复用已验证的产物，避免二次重建。
npmRebuild: false

# Koffi 的平台预编译 .node 在可选的 @koromix 包里；必须在 asar 外才能被 require 加载。
asarUnpack:
  - node_modules/@koromix/koffi-*/**/*

directories:
  output: release/${version}
  buildResources: build

files:
  - dist/**/*
  - resources/**/*
  - package.json
  - THIRD-PARTY-NOTICES.txt
  - "!**/*.map"
  - "!**/node_modules/.cache/**/*"

extraResources:
  - from: resources/icons
    to: icons
  # dsh 双端桥产品包（host 半 index.mjs + client 半 client.js + package.json）。
  # 必须落在 asar **外**（resources/dsh-bridge）：dsh 是独立 node 进程，按绝对路径装载
  # `--patch` 里的 insert 行，asar 内部路径它读不到。安装/装载规则：不经用户 dsh profile 安装，
  # 也不修改已安装 dsh —— 运行期只写一个宿主 owned 的 patch 文件指向这里。
  - from: resources/dsh-bridge
    to: dsh-bridge
  - from: resources/tui-activity
    to: tui-activity
    filter:
      - notify.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: resources/icons/icon-windows.ico
  signtoolOptions:
    sign: null

nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: scripts/installer.nsh
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: LyShell
  displayLanguageSelector: true
  installerLanguages:
    - zh_CN
    - en_US
  language: 2052
  # 协议文件保持 UTF-8 BOM + CRLF，避免 NSIS 按系统代码页读取中文。
  license: resources/licenses/LyShell-LICENSE.txt

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icons/
  category: Utilities
  synopsis: 智能终端软件
  description: LyShell - SSH/Telnet/串口终端 + Python脚本 + AI辅助
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: liangyou09
  repo: lyshell
  releaseType: release
