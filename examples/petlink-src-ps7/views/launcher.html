<!doctype html>
<!-- 源码目录 PS7 终端启动器：点击机柜轨图标即在主区域展开 pwsh 终端。
     纯声明式（无 main / 无插件宿主进程），全部能力经 window.lyshellView。
     CSP script-src 'self'：JS 必须是 views/ 下的外部文件，不能内联。 -->
<html>
<head>
  <meta charset="utf-8" />
  <title>源码 PS7</title>
  <style>
    :root { color-scheme: dark; --pg-bg: #17171b; --pg-fg: #d9d9de; --pg-mute: #8a8a94; --pg-line: #34343c; --pg-btn: #232329; --pg-accent: #4ec9b0; }
    :root[data-theme="light"] { color-scheme: light; --pg-bg: #f6f5f2; --pg-fg: #24242a; --pg-mute: #6f6f78; --pg-line: #d8d6d0; --pg-btn: #ebebe7; }
    * { box-sizing: border-box; }
    body { font: 13px/1.6 system-ui, sans-serif; margin: 0; padding: 12px; background: var(--pg-bg); color: var(--pg-fg); }
    h3 { margin: 0 0 4px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pg-accent); flex: none; }
    .path { margin: 0 0 10px; font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--pg-mute); word-break: break-all; }
    button { display: block; width: 100%; margin: 0 0 8px; padding: 8px 10px; background: var(--pg-btn); color: var(--pg-fg); border: 1px solid var(--pg-line); border-radius: 4px; cursor: pointer; font: inherit; text-align: left; }
    button:hover { border-color: var(--pg-accent); }
    button:disabled { opacity: .55; cursor: default; }
    #status { margin: 4px 0 0; font-size: 12px; color: var(--pg-mute); word-break: break-all; min-height: 2.6em; }
    #status.err { color: #e06c75; }
  </style>
</head>
<body>
  <h3><span class="dot"></span><span id="title">源码 PS7</span></h3>
  <p class="path" id="path">–</p>
  <button id="open" type="button">打开 PS7 终端</button>
  <p id="status">就绪。点击左侧图标或上方按钮，在主区域展开终端。</p>
  <script src="config.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
