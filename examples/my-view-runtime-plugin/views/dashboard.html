<!doctype html>
<!-- my-view-runtime-plugin / dashboard 视图：声明式（manifest contributes.views）。
     演示 callApi 列会话 + openTerminal（需 uiControl + sessionControl）+ openDoc（需 uiControl + read）。 -->
<html>
<head>
  <meta charset="utf-8" />
  <title>Dashboard</title>
  <style>
    /* 主题适配：bootstrap().theme / themeChanged 事件驱动（JS 里给 <html> 打 data-theme） */
    :root { color-scheme: dark; --pg-bg: #17171b; --pg-fg: #d9d9de; --pg-mute: #8a8a94; --pg-line: #34343c; --pg-btn: #232329; }
    :root[data-theme="light"] { color-scheme: light; --pg-bg: #f6f5f2; --pg-fg: #24242a; --pg-mute: #6f6f78; --pg-line: #d8d6d0; --pg-btn: #ebebe7; }
    body { font: 13px/1.6 system-ui, sans-serif; margin: 0; padding: 12px; background: var(--pg-bg); color: var(--pg-fg); }
    h3 { margin: 0 0 8px; }
    button { margin: 0 6px 6px 0; padding: 3px 8px; background: var(--pg-btn); color: var(--pg-fg); border: 1px solid var(--pg-line); border-radius: 2px; cursor: pointer; }
    li { margin-bottom: 4px; }
    #state { opacity: .75; word-break: break-all; margin-bottom: 10px; }
    #doc-path { width: 70%; background: var(--pg-btn); color: var(--pg-fg); border: 1px solid var(--pg-line); }
  </style>
</head>
<body>
  <h3>Dashboard（声明式视图）</h3>
  <div id="state">loading sessions…</div>
  <ul id="sessions"></ul>
  <hr />
  <h4>openDoc（uiControl + read）</h4>
  <input id="doc-path" type="text" placeholder="D:\\notes\\readme.md" />
  <button id="open-doc" type="button">openDoc</button>
  <script src="dashboard.js"></script>
</body>
</html>
